[package]
name = "sh0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lightweight cross-platform TUI SSH/SFTP manager with an AI-first CLI"

[[bin]]
name = "sh0"
path = "src/main.rs"

[dependencies]
sh0-core = { workspace = true }
sh0-term = { workspace = true }
sh0-ssh = { workspace = true }
sh0-store = { workspace = true }
sh0-ipc = { workspace = true }
sh0-ai = { workspace = true }
sh0-tui = { workspace = true }
async-trait = { workspace = true }
russh = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
## 契约测试用假传输层驱动 daemon（NFR-10：不连真机验证 AI 接口）
sh0-core = { workspace = true, features = ["mock"] }

[workspace]
resolver = "3"
members = [
    "crates/sh0-core",
    "crates/sh0-ssh",
    "crates/sh0-term",
    "crates/sh0-store",
    "crates/sh0-ipc",
    "crates/sh0-ai",
    "crates/sh0-tui",
    "crates/sh0-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["creator521314"]
description = "Lightweight cross-platform TUI SSH/SFTP manager with an AI-first CLI"

[workspace.dependencies]
base64 = "0.22"   # 纯 Rust：SFTP 读二进制文件时转 base64 给 AI
# 内部 crate
sh0-core = { path = "crates/sh0-core" }
sh0-ssh = { path = "crates/sh0-ssh" }
sh0-term = { path = "crates/sh0-term" }
sh0-store = { path = "crates/sh0-store" }
sh0-ipc = { path = "crates/sh0-ipc" }
sh0-ai = { path = "crates/sh0-ai" }
sh0-tui = { path = "crates/sh0-tui" }

# 异步与序列化
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# 安全：审计库加密与凭据 vault（均为纯 Rust，无 C 依赖）
regex = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
# vault nonce 的随机源（chacha20poly1305 的 OsRng 走 optional feature，
# 直接依赖更直白；纯 Rust 包装 OS 随机数，无 C 代码）
getrandom = "0.2"
# 审计与归档：SQLite 单文件（FR-8 / FR-9.2）。
# bundled 特性随包编译 SQLite C 源码——与 ring 一样需要 C 编译器（cc 自动探测），
# 换来三平台零外部依赖，值回票价。
rusqlite = { version = "0.34", features = ["bundled"] }
# OS 钥匙串：macOS Keychain / Windows Credential Manager / Linux Secret Service。
# 不可用（如无 dbus 的 Linux）时由 sh0-store 的加密文件 vault 兜底。
keyring = "3"

# 错误处理与日志
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 平台与工具
dirs = "7"
ulid = { version = "3", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# SSH / TUI / CLI
# russh 0.64 强制要求一个 crypto backend：ring 或 aws-lc-rs。
# 选 ring：只需 C 编译器（cc crate 能自动探测 VS），而 aws-lc-rs 额外需要 cmake + nasm。
# 代价是引入 C 依赖，与 NFR-11「纯 Rust 优先」有冲突 —— 见 docs/architecture.md §9 备注。
russh = { version = "0.64", default-features = false, features = ["ring"] }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
